  .f{display:grid;gap:5px;margin-bottom:14px}

  label .opt{font-weight:400;color:var(--stone)}

  textarea{min-height:80px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:480px){.row{grid-template-columns:1fr}}
  .hint{font-size:12.5px;color:var(--stone)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:400;line-height:1.45;margin:18px 0}
  .chk input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:9px;border:0;background:var(--forest);color:#fff;font:700 16px "Manrope",sans-serif;cursor:pointer}

  .btn.s{background:#fff;color:var(--forest);border:1px solid var(--line);min-height:44px;width:auto;padding:0 14px;font-size:14px}
  .err{color:var(--bad);font-weight:600;margin:10px 0 0}
  .ok{text-align:center;padding:14px 0}
  .ok .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto 16px}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{text-align:center;color:#C9B890;font-size:12.5px;margin-top:22px}
  .foot a{color:inherit}
  .co{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:#fff8}
  .co .f:last-child{margin-bottom:0}
  [hidden]{display:none!important}
</style>

  function opts(M, sel, pair){ return Object.keys(M).map(function(k){ var v = pair ? M[k][lang==="en"?0:1] : M[k]; return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+esc(v)+'</option>'; }).join(""); }
  function personFields(p, isCo){
    p = p||{};
    return '<div class="f"><label for="'+p.pre+'name">'+t("fullName")+'</label><input id="'+p.pre+'name" autocomplete="name" required value="'+esc(p.name)+'"></div>'+
